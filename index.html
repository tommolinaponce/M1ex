<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>M1ex — AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(circle at 50% 40%, #24364d, #0b1220 72%);
      color: #f4f7fb;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    h1 { font-size: clamp(1.4rem, 5vw, 2rem); margin: 0 0 8px; }
    p { color: #cbd5e1; margin: 0 0 16px; }
    model-viewer {
      width: 100%; max-width: 360px; height: 280px;
      --poster-color: transparent;
      pointer-events: none; /* sin giro ni zoom en la vista previa */
    }
    #ar-btn {
      border: 0; border-radius: 999px; padding: 18px 32px;
      background: #e2e8f0; color: #0f172a;
      font-size: 1.1rem; font-weight: 700; cursor: pointer;
      margin-top: 12px;
    }
    #ar-btn:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 14px; font-size: .9rem; color: #b8c7d9; min-height: 1.4em; }
  </style>
</head>
<body>
  <h1>M1ex — modelo molecular</h1>
  <p>Tocá el botón para verlo en realidad aumentada.</p>

  <model-viewer
    id="molecule"
    src="./molecula.glb"
    orientation="90deg 90deg 0deg"
    alt="Modelo molecular M1ex"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    scale="0.003 0.003 0.003"
    shadow-intensity="0.7"
    environment-image="neutral"
    loading="eager"
    reveal="auto">
    <button slot="ar-button" id="ar-btn">Ver en AR</button>
  </model-viewer>

  <div id="status" role="status">Cargando el modelo…</div>

  <script>
    const viewer = document.querySelector('#molecule');
    const status = document.querySelector('#status');

    viewer.addEventListener('load', () => {
      status.textContent = viewer.canActivateAR
        ? 'Listo. Tocá “Ver en AR”.'
        : 'Este dispositivo o navegador no admite AR. Probá con Chrome (Android) o Safari (iPhone).';
    });

    viewer.addEventListener('error', (e) => {
      status.textContent = 'No se pudo cargar el modelo (molecula.glb).';
      console.error(e);
    });

    viewer.addEventListener('ar-status', (e) => {
      if (e.detail.status === 'failed') {
        status.textContent = 'El AR falló al iniciar. Revisá que ARCore (Android) esté instalado y actualizado.';
      }
    });
  </script>
</body>
</html>
