<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1ex en realidad aumentada</title>
<style>
body{font-family:system-ui,sans-serif;background:#101827;color:#f4f7fb;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
main{max-width:560px;text-align:center}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:15px 22px;background:#e2e8f0;color:#101827}
p{line-height:1.5;color:#cbd5e1}
#status{font-size:.9rem;color:#aabbd0}
</style>
</head>
<body>
<main>
<h1>M1ex · Realidad aumentada</h1>
<p>Preparando la apertura de la molécula en Google Scene Viewer. Si no se abre automáticamente, tocá el botón.</p>
<button id="open">Abrir molécula en AR</button>
<p id="status">La realidad aumentada requiere Android compatible con Google Play Services for AR y un navegador compatible.</p>
</main>
<script>
const modelURL = new URL('./molecula-ar.glb', location.href).href;
const fallbackURL = location.href;
const intentURL =
  'intent://arvr.google.com/scene-viewer/1.0?file=' +
  encodeURIComponent(modelURL) +
  '&mode=ar_preferred#Intent;scheme=https;package=com.google.android.googlequicksearchbox;' +
  'action=android.intent.action.VIEW;S.browser_fallback_url=' +
  encodeURIComponent(fallbackURL) + ';end;';
function openAR(){ location.href = intentURL; }
document.getElementById('open').addEventListener('click', openAR);
// Attempt direct launch. Some browsers require the explicit button tap.
setTimeout(() => { document.getElementById('status').textContent =
  'Si seguís viendo esta página, tocá “Abrir molécula en AR”.'; }, 1800);
try { openAR(); } catch(e) {}
</script>
</body>
</html>
