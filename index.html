<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>M1ex — AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(circle at 50% 40%, #24364d, #0b1220 72%);
      color: #f4f7fb;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    h1 { font-size: clamp(1.4rem, 5vw, 2rem); margin: 0 0 8px; }
    p { color: #cbd5e1; line-height: 1.5; margin: 0 0 24px; }
    #ar-btn {
      border: 0; border-radius: 999px; padding: 18px 32px;
      background: #e2e8f0; color: #0f172a;
      font-size: 1.1rem; font-weight: 700; cursor: pointer;
    }
    #ar-btn:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 18px; font-size: .9rem; color: #b8c7d9; min-height: 1.4em; }

    /* El model-viewer queda oculto: solo se usa para lanzar el AR */
    model-viewer {
      position: absolute; width: 1px; height: 1px;
      opacity: 0; pointer-events: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>M1ex — modelo molecular</h1>
    <p>Tocá el botón para ver la molécula en realidad aumentada.</p>
    <button id="ar-btn" disabled>Ver en AR</button>
    <div id="status" role="status">Cargando el modelo…</div>
  </main>

  <model-viewer
    id="molecule"
    src="./molecula.glb"
    alt="Modelo molecular M1ex"
    ar
    ar-modes="scene-viewer quick-look webxr"
    ar-placement="floor"
    ar-scale="auto"
    scale="0.003 0.003 0.003"
    loading="eager">
  </model-viewer>

  <script>
    const viewer = document.querySelector('#molecule');
    const btn = document.querySelector('#ar-btn');
    const status = document.querySelector('#status');

    viewer.addEventListener('load', async () => {
      if (!viewer.canActivateAR) {
        status.textContent = 'Este dispositivo no admite AR. Probá con Safari (iPhone) o Chrome (Android).';
        return;
      }
      btn.disabled = false;
      status.textContent = 'Listo.';

      // Intento de apertura automática (muchos navegadores lo bloquean)
      try { await viewer.activateAR(); } catch (e) { /* queda el botón */ }
    });

    viewer.addEventListener('error', () => {
      status.textContent = 'No se pudo cargar el modelo. Verificá que molecula.glb esté junto a index.html.';
    });

    btn.addEventListener('click', () => viewer.activateAR());
  </script>
</body>
</html>
